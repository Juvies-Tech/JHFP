<!DOCTYPE html>
<!-- .gated is the DEFAULT so the app chrome never flashes before we know who is
     signed in. gateBoot() removes it the moment a valid session is found. --><html lang="en" class="gated">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>JHFP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JHFP">
<meta name="theme-color" content="#14100E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* One merged theme. Ember leads; Summit's glacier survives as the data colour.
   No toggle -- both palettes now live inside the same design. */
:root{
--bg:#14100E; --bg2:#181310; --s1:#1C1613; --s2:#241C18; --s3:#2E2420;
--acc:#D9542B; --acc2:#E8734A; --accdim:#3A2117; --accbd:#5A3121;
--ice:#7FB2C9; --icedim:#16232A; --icebd:#2A4550;
--grn:#8FC46B; --grndim:#18200F; --grnbd:#36471F;
--amb:#E8A33A; --ambdim:#241B0D; --ambbd:#4E3A16;
--red:#C9564A; --reddim:#241312; --redbd:#4E2320;
--tx:#F5F0EC; --tx2:#BFB3AC; --tx3:#8C7F77;
--bd:#2E231E; --bd2:#3D2E27;
--ok:var(--grn); --warn:var(--amb); --bad:var(--red);
/* anatomy chart: an untrained muscle must be clearly VISIBLE. Using --s3 for it
   made the figure read as black holes on a black background, which is the exact
   complaint that triggered this rebuild. --musf is the non-muscle filler
   (head, hands, feet) and sits a step darker so it is obviously not a muscle. */
--mus0:#4E3E36; --musf:#30251F;
--r:12px; --sf:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:
 radial-gradient(120% 55% at 50% -8%, #2B1810 0%, rgba(43,24,16,0) 62%),
 radial-gradient(90% 42% at 50% 108%, #211613 0%, rgba(33,22,19,0) 60%),
 var(--bg); background-attachment:fixed}
html,body{margin:0;padding:0;color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
font-size:16px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(68px + var(--sf))}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{background:var(--s2);border:1px solid var(--bd);border-radius:9px;
padding:10px 12px;color:var(--tx);width:100%;outline:none}
input:focus,select,textarea:focus{border-color:var(--acc)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wrap{padding:0 16px;max-width:640px;margin:0 auto}
.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;display:flex;
justify-content:space-between;align-items:flex-end;max-width:640px;margin:0 auto}
.brand{font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--acc)}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.sub{font-size:13px;color:var(--tx3)}
.card{background:var(--s1);border-radius:var(--r);padding:14px;margin-bottom:10px;
border:1px solid var(--bd2);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bd2)}
.card.acc{border-color:var(--accbd);background:linear-gradient(100deg,var(--accdim),var(--s1) 46%)}
.card.acc::before{background:var(--acc)}
.card.ice{border-color:var(--icebd);background:linear-gradient(100deg,var(--icedim),var(--s1) 46%)}
.card.ice::before{background:var(--ice)}
.card.grn{border-color:var(--grnbd);background:linear-gradient(100deg,var(--grndim),var(--s1) 46%)}
.card.grn::before{background:var(--grn)}
.card.amb{border-color:var(--ambbd);background:linear-gradient(100deg,var(--ambdim),var(--s1) 46%)}
.card.amb::before{background:var(--amb)}
.card.red{border-color:var(--redbd);background:linear-gradient(100deg,var(--reddim),var(--s1) 46%)}
.card.red::before{background:var(--red)}
.card.flat{background:var(--s1);border:1px solid var(--bd)}
.card.flat::before,.card.plain::before{display:none}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;
font-size:15px;font-weight:600;text-align:center;display:block;width:100%;color:var(--tx)}
.btn:active{transform:scale(.985)}
.btn.p{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;display:inline-block}
.btn.gh{background:none;border-color:var(--bd);color:var(--tx2)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
background:var(--s3);color:var(--tx2);letter-spacing:.03em}
.pill.a{background:var(--accdim);color:var(--acc2);border:1px solid var(--accbd)}
.pill.g{background:var(--grndim);color:var(--grn);border:1px solid var(--grnbd)}
.pill.i{background:var(--icedim);color:var(--ice);border:1px solid var(--icebd)}
.pill.b{background:var(--ambdim);color:var(--amb);border:1px solid var(--ambbd)}
.bar{height:6px;background:var(--s3);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(24,19,16,.94);
border-top:1px solid var(--bd2);display:flex;padding-bottom:var(--sf);z-index:50;backdrop-filter:blur(16px)}
.nav button{flex:1;padding:10px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;
font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:.02em;position:relative;transition:color .15s}
.nav button svg{opacity:.5;transition:opacity .15s,transform .15s}
.nav button.on svg{opacity:1;transform:translateY(-1px)}
.nav button[data-v=today].on{color:var(--acc)}
.nav button[data-v=train].on{color:var(--amb)}
.nav button[data-v=fuel].on{color:var(--red)}
.nav button[data-v=prog].on{color:var(--ice)}
.nav button[data-v=more].on{color:var(--grn)}
.nav button.on::after{content:"";position:absolute;top:0;left:26%;right:26%;height:2px;
border-radius:0 0 3px 3px;background:currentColor}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
stroke-linecap:round;stroke-linejoin:round}
/* the week picker at the top of Train */
.pickbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:linear-gradient(100deg,var(--accdim),var(--s2) 62%);
  border:1px solid var(--accbd);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.pickbar:active{transform:scale(.99)}
/* a row in the picker sheet */
.pk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--s2);border:1px solid var(--bd);border-radius:11px;
  padding:11px 12px;margin-bottom:7px}
.pk.now{border-color:var(--acc);background:linear-gradient(100deg,var(--accdim),var(--s2) 60%)}
.pk.did{opacity:.62}
.pk .pkn{font-weight:600;font-size:14px}
.pk .pkm{font-size:12px;color:var(--tx3);margin-top:1px}

/* ---------- COLLAPSIBLE SECTIONS ----------
   Progress and More had grown into single scrolls you had to thumb through to
   find anything. A section is now a coloured heading you tap, and the colour
   alternates ember / glacier down the page so the headings read as landmarks
   rather than as a uniform list. Open state persists per section in D.ui.sec.

   .secw is the wrapper and carries the tone; .sech is the tappable heading;
   .secb is the body. A PINNED section (Programme, Volume) renders .sech with
   no chevron and no button behaviour — same look, always open. */
.secw{margin:18px 0 10px;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--bd2);background:var(--s1)}
.secw:first-child{margin-top:8px}
.sech{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 13px;position:relative;background:var(--s2)}
.sech::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bd2)}
.secw.acc .sech{background:linear-gradient(100deg,var(--accdim),var(--s2) 62%)}
.secw.acc .sech::before{background:var(--acc)}
.secw.acc .secn{color:#F0C0AC}
.secw.ice .sech{background:linear-gradient(100deg,var(--icedim),var(--s2) 62%)}
.secw.ice .sech::before{background:var(--ice)}
.secw.ice .secn{color:#BEDDEA}
.secn{font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.secm{font-size:12px;color:var(--tx3);font-weight:600;white-space:nowrap}
.secx{font-size:13px;color:var(--tx3);transition:transform .18s ease;
  display:inline-block;flex:0 0 auto}
.secw.on .secx{transform:rotate(90deg)}
.secb{padding:12px 13px 4px}
/* cards sitting inside a section lose their own outer border so the section
   frame is the only box — nesting two bordered boxes looked like a bug */
.secb .card{border-left-width:1px}
.secb>*:last-child{margin-bottom:10px}
.sece{padding:0 13px 13px;font-size:13px;color:var(--tx3)}

/* ---------- LOGIN PORTAL ----------
   Full-bleed gate that sits over everything until a profile is signed in. The
   icon artwork is the backdrop: blown up, heavily dimmed and blurred so it
   reads as texture rather than a picture of a kettlebell, with the ember
   gradient of the app laid over it so the portal and the app feel like one
   thing. Body scroll is locked while it is up (.gated on <html>). */
.gate{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.gate::before{content:"";position:fixed;inset:0;z-index:0;
  background-image:url(icon.png);background-size:150% auto;background-position:50% 18%;
  background-repeat:no-repeat;filter:blur(26px) saturate(1.1);opacity:.34}
.gate::after{content:"";position:fixed;inset:0;z-index:1;background:
  radial-gradient(115% 50% at 50% 0%, rgba(160,52,24,.42) 0%, rgba(20,16,14,0) 60%),
  linear-gradient(180deg, rgba(20,16,14,.55) 0%, rgba(20,16,14,.88) 42%, var(--bg) 78%)}
.gate.hidden{display:none}
html.gated,html.gated body{overflow:hidden}
.gatec{position:relative;z-index:2;width:100%;max-width:460px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 34px) 20px calc(var(--sf) + 30px)}
.gmark{width:74px;height:74px;border-radius:19px;display:block;margin:0 auto 14px;
  box-shadow:0 10px 34px rgba(0,0,0,.55)}
.gtitle{font-size:27px;font-weight:700;letter-spacing:-.02em;text-align:center}
.gsub{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--acc2);text-align:center;margin-top:5px}
.gcard{background:rgba(28,22,19,.82);border:1px solid var(--bd2);border-radius:16px;
  padding:16px;margin-top:20px;backdrop-filter:blur(14px)}
.gerr{background:var(--reddim);border:1px solid var(--redbd);color:#F0A79C;
  border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:10px}
.gok{background:var(--grndim);border:1px solid var(--grnbd);color:var(--grn);
  border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:10px}
.gwarn{background:var(--ambdim);border:1px solid var(--ambbd);border-radius:14px;
  padding:13px 14px;margin-top:20px}
.gwarn .gwt{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;
  color:var(--amb);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.gwarn .jm{color:var(--tx2)}
.gwarn .jm b{color:var(--tx)}
.glink{display:block;width:100%;text-align:center;font-size:13px;color:var(--tx3);
  margin-top:13px;text-decoration:underline;text-underline-offset:3px}
.gfield{margin-bottom:9px}
.gfield label{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
/* who-is-this list on the portal */
.gwho{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.gwho:active{border-color:var(--acc)}
.gwho .nm{font-size:15px;font-weight:600;line-height:1.2}
.gwho .mt{font-size:12px;color:var(--tx3);margin-top:1px}
/* ---------- AVATARS ----------
   One class everywhere a face appears: portal, More, Manage Accounts. Falls
   back to the initial on a tinted disc when no picture has been set, so the
   layout never shifts depending on whether someone uploaded a photo. */
.av{width:42px;height:42px;border-radius:50%;flex:0 0 auto;object-fit:cover;
  background:var(--accdim);border:1px solid var(--accbd);display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:17px;
  color:var(--acc2);overflow:hidden;text-transform:uppercase}
.av.lg{width:78px;height:78px;font-size:30px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
/* philosophy panel */
.phil{margin-top:16px}
.phil .pt{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid rgba(62,46,39,.5)}
.phil .pt:last-child{border-bottom:none}
.phil .pn{font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.06em;
  flex:0 0 20px;padding-top:3px;font-variant-numeric:tabular-nums}
.phil .phh{font-size:14px;font-weight:600;line-height:1.3}
.phil .phb{font-size:13px;color:var(--tx2);margin-top:2px;line-height:1.45}
.view{display:none;animation:fi .18s ease}
.view.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ex{background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ex.done{border-color:var(--grnbd);background:linear-gradient(100deg,var(--grndim),var(--s1) 40%)}
.exh{padding:13px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exn{font-size:16px;font-weight:600;line-height:1.25}
.exm{font-size:12px;color:var(--tx3);margin-top:3px}
.exb{padding:0 14px 12px;border-top:1px solid var(--bd);margin-top:2px;padding-top:10px}
.st{display:grid;grid-template-columns:22px 1fr 1fr 42px 44px 30px;gap:5px;align-items:center;margin-bottom:6px}
/* a set logged at bodyweight reads BW, not 1kg */
.st input.bw{color:var(--grn);font-weight:700}
/* rest actually taken, sitting next to the completion tick */
.rsc{font-size:11px;font-weight:700;color:var(--ice);text-align:center;font-variant-numeric:tabular-nums}
.ex.skip{opacity:.45;border-color:var(--bd)}
.ex.skip .exn{text-decoration:line-through;text-decoration-thickness:2px;color:var(--tx3)}
.ex.skip .exm{text-decoration:line-through}
/* a removed exercise is locked: nothing inside it can be typed into or ticked */
.ex.skip .exb input,.ex.skip .exb .tick{pointer-events:none;opacity:.4}
.kebab{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
color:var(--tx3);background:var(--s2);border:1px solid var(--bd);flex:0 0 30px}
.kebab:active{background:var(--s3)}
.mi{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--bd);
font-size:15px;width:100%;text-align:left;color:var(--tx)}
.mi:last-child{border-bottom:none}
.mi svg{width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 18px}
.mi.bad{color:var(--bad)} .mi.bad svg{stroke:var(--bad)}
/* progress photos */
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ph{position:relative;border-radius:10px;overflow:hidden;background:var(--s2);aspect-ratio:3/4}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px;font-weight:600;
background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
.ph .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:11px;
background:rgba(0,0,0,.6);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
/* the quote block */
.quote{font-size:15px;line-height:1.5;font-style:italic;color:var(--tx2)}
.quote b{font-style:normal;color:var(--acc2)}
.st>span:first-child{font-size:12px;color:var(--tx3);font-weight:600}
.st input{padding:9px 8px;text-align:center;font-size:15px;font-weight:600}
.st .u{font-size:10px;color:var(--tx3);text-align:center}
.tick{background:var(--s2);border:1px solid var(--bd);border-radius:8px;height:38px;
display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.tick.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tgt{font-size:12px;color:var(--acc2);background:var(--accdim);border:1px solid var(--accbd);border-radius:7px;
padding:7px 10px;margin-bottom:9px;line-height:1.4}
.jr{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--bd)}
.jr:last-child{border-bottom:none}
.jb{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--bd);flex:0 0 26px;
display:flex;align-items:center;justify-content:center;background:var(--s2)}
.jb.on{background:var(--acc);border-color:var(--acc)}
.jb svg{width:14px;height:14px;stroke:var(--bg);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.jb.on svg{opacity:1}
.jt{font-size:15px;flex:1}
.jm{font-size:11px;color:var(--tx3)}
.mono{font-variant-numeric:tabular-nums}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat{border-radius:var(--r);padding:11px 12px;border:1px solid var(--bd2);background:var(--s1)}
.stat.acc{border-color:var(--accbd);background:var(--accdim)} .stat.acc .big{color:var(--acc2)}
.stat.ice{border-color:var(--icebd);background:var(--icedim)} .stat.ice .big{color:var(--ice)}
.stat.grn{border-color:var(--grnbd);background:var(--grndim)} .stat.grn .big{color:var(--grn)}
.stat.amb{border-color:var(--ambbd);background:var(--ambdim)} .stat.amb .big{color:var(--amb)}
.stat.red{border-color:var(--redbd);background:var(--reddim)} .stat.red .big{color:var(--red)}
.mid{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tiny{font-size:11px;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;
align-items:flex-end;backdrop-filter:blur(3px)}
.sheet.on{display:flex}
.sheetc{background:var(--bg2);width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;
padding:18px 16px calc(24px + var(--sf));border-top:1px solid var(--bd);animation:up .22s ease}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.timer{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--sf));background:var(--acc);
color:var(--bg);border-radius:12px;padding:11px 15px;display:none;z-index:60;
align-items:center;justify-content:space-between;font-weight:700;max-width:616px;margin:0 auto}
.timer.on{display:flex}
/* once the prescribed rest is used up the bar keeps counting UP rather than
   disappearing, so "Done" still records an honest number */
.timer.over{background:var(--amb)}
.hm{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px}
.hmc{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:9px 10px}
.hmc .n{font-size:12px;color:var(--tx2);margin-bottom:5px}
.hmc .v{font-size:17px;font-weight:700}
.pgc{background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r);padding:14px;margin-bottom:9px}
.pgc.on{border-color:var(--acc);background:linear-gradient(100deg,var(--accdim),var(--s1) 50%)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;font-size:13px;font-weight:600;padding:7px 13px;border-radius:20px;
background:var(--s2);color:var(--tx3);border:1px solid var(--bd)}
.tab.on{background:var(--accdim);color:var(--acc2);border-color:var(--accbd)}

display:flex;justify-content:space-between;align-items:center;gap:10px}

<body>

<script>
/* ==== JHFP · Juvies Health & Fitness Protocol ============================
   Built for Juan "Juvies" Lindeque. Single-file PWA, data in localStorage.
   ======================================================================== */

/* ---- STORAGE ADAPTER ----
   Every read and write in the app goes through STORE, never through
   localStorage directly. Today it IS localStorage. The point of the indirection
   is that swapping in a cloud backend later (Supabase was the option costed)
   becomes a change to this one object plus an async boot, rather than a hunt
   through 2,000 lines for every getItem call. Keep it that way: if you find
   yourself typing localStorage anywhere below this block, put it here instead.

   Synchronous on purpose. A remote backend would hydrate a cache into `mem`
   during boot and let these stay sync, which is far less invasive than making
   every caller await. */
const STORE={
  mem:null,                                  // reserved for a future hydrated cache
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){
    /* quota is the realistic failure here — usually progress photos */
    try{alert('Storage is full. Free space by deleting some progress photos under Progress.')}catch(_){}
    return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}},
  json(k,f){try{const v=this.get(k);return v?JSON.parse(v):f}catch(e){return f}},
  setJson(k,o){return this.set(k,JSON.stringify(o))}
};

/* ---- WHICH PROFILE ARE WE? ----
   Multiple members can each keep their own log on this phone. The profile
   INDEX lives under 'jhfp_profiles'; each profile's data lives under its own
   key. Juan is 'juan' and deliberately keeps the ORIGINAL 'jhfp_v1' key, so
   upgrading does not orphan a single day of his existing history.

   Beta 2.0 adds a SESSION on top: 'jhfp_session' records who actually signed in
   on this device. The signed-in profile wins over the index's `cur`, because
   `cur` is only a "last used" hint and must never by itself grant access to
   somebody else's log. No session means the login portal is shown and the app
   is not rendered at all. */
const SKEY='jhfp_session';
/* A session is only honoured if it names a profile that still exists AND its
   binding token still matches that profile's credential, AND it has not aged
   out. Validating "pid exists" alone made the session a bearer token that
   could be forged by hand-editing one localStorage value — which would have
   made the whole login screen decorative. */
const SESS_DAYS=60;
function sessionBind(p){
  /* KNOW WHAT THIS DOES AND DOES NOT DO.

     It makes a hand-edited session fail: change `pid` to somebody else and the
     token no longer matches, so the session is thrown away. It also expires a
     session when the underlying password changes or is reset.

     It does NOT stop anyone who can run a line of JavaScript on this phone.
     Every input to the token is readable from the same localStorage, and this
     function is a global, so the token can simply be recomputed — and in any
     case someone at that level can read the raw record directly and skip the
     session entirely. A pure client-side app cannot defend against its own
     device. That is not a bug to be fixed here; it is the reason the cloud
     option exists, and it is why the login screen promises only that the
     password keeps other PEOPLE out of your log, never that the data is
     protected. Do not let the copy drift into claiming more than this. */
  const seed=(p&&((p.auth&&(p.auth.h||(p.auth.master?'master':'')))||p.pin||'')) +'|'+ (p&&p.id) +'|'+ (p&&p.created||'');
  return weakHashSync(seed);
}
function weakHashSync(s){let h1=0x12345678,h2=0x9e3779b9;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);
    h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return ((h2>>>0).toString(16).padStart(8,'0'))+((h1>>>0).toString(16).padStart(8,'0'));
}
function sessionPid(){
  const s=STORE.json(SKEY,null);
  if(!s||!s.pid)return null;
  if(!s.at||(Date.now()-s.at)>SESS_DAYS*864e5){STORE.del(SKEY);return null}
  const idx=STORE.json('jhfp_profiles',null);
  const p=idx&&idx.list&&idx.list.filter(Boolean).find(x=>x.id===s.pid);
  if(!p){STORE.del(SKEY);return null}
  if(s.k!==sessionBind(p)){STORE.del(SKEY);return null}   // credential changed, or forged
  return s.pid;
}
/* SIGNED is fixed for the life of the page. Everything downstream keys off it:
   with no session we must not read, paint or write anybody's record. */
const SIGNED=sessionPid();
/* The data key. When nobody is signed in there is no key — the app runs on a
   throwaway in-memory record so that an unauthenticated boot cannot leak the
   last user's log, and (just as important) cannot overwrite it. */
function curPid(){return SIGNED||null}
const K=SIGNED?(SIGNED==='juan'?'jhfp_v1':'jhfp_v1__'+SIGNED):null;
const DEF={
  settings:{name:'Juvies',age:22,height:178,weight:84,
    kcal:3500,protein:210,fat:295,bareMode:false,restDefault:90,screenLock:false},
  /* Adventurer is the landing programme for a NEW record only. An existing
     record's own `active` always wins, because load() merges the stored record
     OVER DEF — so this cannot move Juan off P4, and there is a test for that.
     Landing a stranger in week 1 of a ten-week kettlebell block would be a
     terrible first screen; Adventurer lets them look around first. */
  active:{id:'p11',start:todayISO(),week:1},
  /* rest = dates the QUEUE treated as programmed off-days. Once the schedule
     stops tracking the calendar there is no other way to tell a rest day from
     a missed one when walking back through history. */
  logs:{}, journal:{}, food:{}, pbs:{}, bench:{}, mobility:{}, assess:[], weights:{}, completed:[], rest:{},
  /* ui.sec = which collapsible sections are open. It lives in DEF as well as in
     migrate() so that a straight copy of DEF is a COMPLETE record — anything
     that builds a record without going through load() would otherwise get a
     half-shaped ui object. */
  custom:{}, mine:[], photos:[], ui:{sidx:0, sec:{}}
};
/* Set when the stored record exists but will not parse. While it is true, save()
   refuses to write — otherwise the very first save of the session would flatten
   a recoverable record with an empty one. A corrupt record is a bad day; a
   corrupt record silently overwritten by a blank one is a lost year.

   DECLARED BEFORE load() IS CALLED, and that ordering is the whole point. `let`
   bindings sit in a temporal dead zone until their declaration is evaluated, so
   with this line below `let D=load()` the assignment inside load()'s catch threw
   "Cannot access 'CORRUPT' before initialization" — which meant the corrupt-
   record branch could never run, no rescue copy was ever written, and the throw
   took the rest of the boot script with it. The protection existed and had never
   once executed. Do not move this line below `let D=load()`. */
let CORRUPT=false;
let D=load();
function todayISO(d){d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function load(){
  if(!K)return migrate(JSON.parse(JSON.stringify(DEF)));   // not signed in: scratch record
  const raw=STORE.get(K);
  if(raw===null||raw==='')return migrate(JSON.parse(JSON.stringify(DEF)));
  let r=null;
  try{r=JSON.parse(raw)}
  catch(e){
    CORRUPT=true;
    /* keep the bytes; a human can still get data out of them */
    try{if(!STORE.get(K+'__corrupt'))STORE.set(K+'__corrupt',raw)}catch(_){}
    return migrate(JSON.parse(JSON.stringify(DEF)));
  }
  /* Parsing is not the same as being readable. A record can be perfectly valid
     JSON and still be structurally wrong — `logs` arriving as a string is the
     case that caught this out: deep() does not throw, migrate() iterates the
     string's character indices, and the result is a plausible-looking empty
     record that then overwrites the real one on the first save. Anything that
     is not the shape we wrote is treated as corrupt and preserved. */
  if(!looksLikeRecord(r)){
    CORRUPT=true;
    try{if(!STORE.get(K+'__corrupt'))STORE.set(K+'__corrupt',raw)}catch(_){}
    return migrate(JSON.parse(JSON.stringify(DEF)));
  }
  try{return migrate(deep(DEF,r))}
  catch(e){
    CORRUPT=true;
    try{if(!STORE.get(K+'__corrupt'))STORE.set(K+'__corrupt',raw)}catch(_){}
    return migrate(JSON.parse(JSON.stringify(DEF)));
  }
}
function isObj(v){return !!v&&typeof v==='object'&&!Array.isArray(v)}
function looksLikeRecord(r){
  if(!isObj(r))return false;
  /* every container we later iterate must actually be a container */
  if('logs' in r&&!isObj(r.logs))return false;
  if('settings' in r&&!isObj(r.settings))return false;
  if('journal' in r&&!isObj(r.journal))return false;
  if('food' in r&&!isObj(r.food))return false;
  if('pbs' in r&&!isObj(r.pbs))return false;
  if('active' in r&&!isObj(r.active))return false;
  /* and every list must be a list */
  if('photos' in r&&!Array.isArray(r.photos))return false;
  if('mine' in r&&!Array.isArray(r.mine))return false;
  if('assess' in r&&!Array.isArray(r.assess))return false;
  return true;
}

/* ---- MIGRATION: one session per day -> MANY ----
   Up to v4 a day held exactly ONE session object at D.logs[date]. Starting a
   second workout that day silently overwrote the first — which is how Juan lost
   a push session behind a Simple & Sinister. Each date now holds an ARRAY of
   sessions. Old records are wrapped in an array in place, so no logged day is
   lost on upgrade, and the migration is idempotent: an array is left alone. */
function migrate(d){
  d.logs=d.logs||{};
  for(const k in d.logs){
    let v=d.logs[k];
    if(!v)               {delete d.logs[k];continue}
    if(!Array.isArray(v)) v=d.logs[k]=[v];
    /* drop any null element — everything downstream assumes a real session */
    const clean=v.filter(x=>x&&typeof x==='object');
    if(!clean.length) delete d.logs[k]; else d.logs[k]=clean;
  }
  d.photos=d.photos||[];
  d.ui=d.ui||{sidx:0};
  /* which collapsible sections are open. Beta 2.0; absent on older records. */
  d.ui.sec=d.ui.sec||{};
  d.rest=d.rest||{};                 // queue-mode off-day record, Beta 2.0
  /* migrate() can be handed a record with no settings at all — a hand-written
     backup, or a test fixture. Never assume a sub-object exists here. */
  d.settings=d.settings||{};
  /* NOTE: the GoWod score seeding does NOT live here, and must not be moved
     back. migrate() runs inside THIS inline script, which the browser executes
     BEFORE data.js — so MOBSCORES does not exist yet. The first version guarded
     with `typeof MOBSCORES!=='undefined'` and fell through to `{}`; because
     `{}` is truthy the "not set yet" check then never fired again on any later
     boot, so the seed was permanently dead and Juan's scores never landed.
     It is now seedMobScores() in app.js, called at boot once data.js is in. */
  return d;
}
function deep(d,r){const o=JSON.parse(JSON.stringify(d));for(const k in r){
  if(r[k]&&typeof r[k]==='object'&&!Array.isArray(r[k])&&o[k])o[k]=deep(o[k],r[k]);else o[k]=r[k]}return o}
/* Three guards, each of which was a real failure mode:
   - no key  → nobody is signed in, so there is no record this belongs to
   - CORRUPT → refuse to overwrite bytes we could not read
   Returns false when it did not write, so callers can react instead of
   assuming success. */
function save(){
  if(!K||CORRUPT)return false;
  return STORE.setJson(K,D);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n,d){return Number(n||0).toFixed(d===undefined?0:d)}
const CHK='<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
</script>
